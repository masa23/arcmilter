name: pinact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dependabot coverage
        run: ruby .github/scripts/check-dependabot-action-coverage.rb

      - name: Create pinact config
        run: bash .github/scripts/create-pinact-config.sh .pinact.ci.yaml

      - name: Check pinned Actions
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        env:
          PINACT_GLOBAL_CONFIG: .pinact.yaml
        with:
          config: .pinact.ci.yaml
          fix: "false"
          skip_push: "true"
          verify: "true"
          verify_min_age: "true"
