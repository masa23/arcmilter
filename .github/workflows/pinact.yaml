name: pinact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".pinact.yaml"
      - "action.yml"
      - "action.yaml"
      - "**/action.yml"
      - "**/action.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check pinned Actions
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          config: .pinact.yaml
          fix: "false"
          skip_push: "true"
          verify: "true"
          verify_min_age: "true"
